upstream fintrack_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name myfintrack.fit www.myfintrack.fit;

    client_max_body_size 20M;

    location / {
        proxy_pass http://fintrack_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# After certbot: use `certbot --nginx -d myfintrack.fit -d www.myfintrack.fit`
# Certbot will add listen 443 ssl and certificate paths to this file or a separate snippet.
