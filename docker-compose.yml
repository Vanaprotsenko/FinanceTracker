services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8000:80
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/db
      - RUN_MIGRATIONS=1
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

#  telegram-bot:
#    build:
#      context: ./
#      dockerfile: Dockerfile
#    command: python /code/src/bot/bot.py
#    environment:
#      - DATABASE_URL=postgresql://postgres:postgres@db:5432/db
#      - RUN_MIGRATIONS=0
#    env_file:
#      - .env
#    depends_on:
#      db:
#        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: